    g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = 1; g.beginPath(); for (const b of P.boxes) { g.moveTo(b.div[0], b.div[1]); g.lineTo(b.div[2], b.div[3]); } g.stroke();

    const poly = k => { g.beginPath(); lv.v.forEach((v, i) => { const x = lv.x + Math.cos(v[0])*lv.r*v[1]*k, y = lv.y + Math.sin(v[0])*lv.r*v[1]*k; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath(); };

  }
  // Rocas
  for (const r of rocks) {

      g.fillStyle = 'rgba(40,60,90,.28)'; star(t.x + SUN.x*t.r*1.3, t.y + SUN.y*t.r*1.3, t.r, 1.05); g.fill();

      g.fillStyle = 'rgba(245,250,255,.92)'; star(t.x - SUN.x*3, t.y - SUN.y*3, t.r, 0.45); g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)'; star(t.x - SUN.x*t.r*0.3, t.y - SUN.y*t.r*0.3, t.r, 0.6); g.fill();
      g.fillStyle = '#f6f9fc'; g.beginPath(); g.arc(t.x - SUN.x, t.y - SUN.y, 2.2, 0, 7); g.fill();

    if (t.dead) {   // árbol quemado: ramas negras
      g.lineCap = 'round';
      for (const [sx, sy, col, lw] of [[SUN.x*t.r*0.9, SUN.y*t.r*0.9, 'rgba(0,0,0,.3)', 1], [0, 0, '#17110e', 1]]) {

    if (t.palm) {   // palmera: sombra de las hojas, hojas con nervadura y cocos

        for (const [a, len, w] of t.fr) {
          const ex = ox + Math.cos(a)*len, ey = oy + Math.sin(a)*len, nx = -Math.sin(a), ny = Math.cos(a), bw = t.r*0.22*w;
          const mx = ox + Math.cos(a)*len*0.55, my = oy + Math.sin(a)*len*0.55;
          g.fillStyle = col; g.beginPath(); g.moveTo(ox, oy); g.quadraticCurveTo(mx + nx*bw, my + ny*bw, ex, ey); g.quadraticCurveTo(mx - nx*bw*0.6, my - ny*bw*0.6, ox, oy); g.fill();
          if (mid) { g.strokeStyle = mid; g.lineWidth = 0.8; g.beginPath(); g.moveTo(ox, oy); g.quadraticCurveTo(mx + nx*bw*0.2, my + ny*bw*0.2, ex, ey); g.stroke(); }

      lg.addColorStop(0, '#9cc25a'); lg.addColorStop(0.6, '#4f8a35'); lg.addColorStop(1, '#2f5a22');

      for (let i = 0; i < 3; i++) { g.fillStyle = '#6b4a22'; g.beginPath(); g.arc(t.x + Math.cos(i*2.1)*2.2, t.y + Math.sin(i*2.1)*2.2, 2.2, 0, 7); g.fill(); }
      continue;
    }
    const sx = t.x + SUN.x*t.r*1.4, sy = t.y + SUN.y*t.r*1.4;
    const sg = g.createRadialGradient(sx, sy, t.r*0.2, sx, sy, t.r*1.25);
    sg.addColorStop(0, 'rgba(10,25,5,.55)'); sg.addColorStop(1, 'rgba(10,25,5,0)');
    g.fillStyle = sg; g.beginPath(); g.arc(sx, sy, t.r*1.25, 0, 7); g.fill();

    for (const [dx, dy, r, k] of t.leaves) {

      g.beginPath(); g.arc(t.x + dx, t.y + dy, r, 0, 7); g.fill();

  }

function requestTile(i, j) {
  if (tilesBroken) return null;
  const k = i + ',' + j, t = tiles.get(k);
  if (t) { t.used = frameNo; return t.c; }
  if (!queued.has(k)) { queued.add(k); bakeQueue.push([i, j]); }
  return null;
}
function processBake(budgetMs) {
  if (!bakeQueue.length) return;
  const cx = cam.x/TS, cy = cam.y/TS;
  bakeQueue.sort((a, b) => Math.hypot(a[0] + 0.5 - cx, a[1] + 0.5 - cy) - Math.hypot(b[0] + 0.5 - cx, b[1] + 0.5 - cy));
  const t0 = performance.now();
  do {
    const [i, j] = bakeQueue.shift(), k = i + ',' + j; queued.delete(k);
    let cv_;
    try { cv_ = bakeTile(i, j); }
    catch (e) { tilesBroken = true; clearTiles(); console.warn('Tiles desactivados:', e); return; }
    const tb = performance.now() - t0;
    if (!introBake && tb > (MAXQ ? 160 : 90) && TSC > 0.8) { TSC = Math.max(0.8, TSC - 0.25); }   // equipo lento: tiles más livianos
    tiles.set(k, { c: cv_, used: frameNo });
    if (tiles.size > MAX_TILES) {
      let lk = null, lu = 1e12; for (const [kk, v] of tiles) if (v.used < lu) { lu = v.used; lk = kk; }
      if (lk) { tilePool.push(tiles.get(lk).c); tiles.delete(lk); }
    }
  } while (bakeQueue.length && performance.now() - t0 < budgetMs);
}
function clearTiles() { tiles.clear(); queued.clear(); bakeQueue = []; tilePool.length = 0; }

// Caja de cambios: fracción de la velocidad máxima a 8000 rpm en cada marcha
const GEARS = [0.19, 0.31, 0.44, 0.58, 0.74, 0.92, 1.12];
const ENG = { gear: 0, rpm: 900, load: 0, shiftT: 0, popT: 0, popNext: 0, prevLoad: 0 };
function rpmFor(vr, g) { return 900 + vr/GEARS[g]*7100; }
function rivalRPM(v) { const vr = v/C.velocidadMaxima; let g = 0; while (g < GEARS.length - 1 && rpmFor(vr, g) > 7600) g++; return Math.max(1000, rpmFor(vr, g)); }

function audioUpdate(dt, held) {
  if (!AU.ok) return;
  const t = AU.ac.currentTime, p = player, vr = Math.max(0, p.v || 0)/C.velocidadMaxima;
  // terminada la carrera (resultados o repetición) el motor baja a ralentí y se apaga de a poco
  const done = (state === 'finish' && stateT > 2.2) || replayOn;
  const racing = (state === 'race' || state === 'finish') && !done;
  const thr = (state === 'race' && (held || p.reverse)) || (state === 'finish' && p.throttle);

  let target;
  if (state === 'countdown') {
    target = held ? 7000 - (Math.sin(animT*36) > 0.5 ? 650 : 0) : 1000;
    ENG.load += ((held ? 1 : 0) - ENG.load)*Math.min(1, dt*10);
  } else if (!racing) { target = done ? 800 : 950; ENG.load += (0 - ENG.load)*Math.min(1, dt*6); }
  else if (p.stallT > 0) { target = 6900 - (Math.sin(animT*30) > 0.4 ? 900 : 0); ENG.load += (1 - ENG.load)*Math.min(1, dt*10); }
  else if (p.reverse) { target = 1400 + vr*30000; ENG.gear = 0; ENG.load += (1 - ENG.load)*Math.min(1, dt*8); }
  else {
    let g = ENG.gear, r = rpmFor(vr, g);
    if (r > 7800 && g < GEARS.length - 1) { g++; ENG.shiftT = 0.12; p.popFx = 0.14; if (Math.random() < 0.6) sfxPop(); }
    else if (g > 0 && r < 3700) g--;

    if (g === 0 && thr) r = Math.max(r, 3000 + vr*20000);
    r += (p.skid > 0.4 && thr ? (p.skid - 0.4)*2200 : 0);
    target = Math.min(8300, r);
    if (ENG.shiftT > 0) ENG.shiftT -= dt;
    const ld = thr && ENG.shiftT <= 0 ? 1 : 0;
    ENG.load += (ld - ENG.load)*Math.min(1, dt*(ld ? 9 : 12));
  }
  ENG.rpm += (target - ENG.rpm)*Math.min(1, dt*(ENG.shiftT > 0 ? 28 : 12));
  const quiet = done || !(state === 'countdown' || state === 'race' || state === 'finish');   // resultados, repetición y menús: sin efectos
  ENG.vol = quiet ? Math.max(0, (ENG.vol === undefined ? 0.75 : ENG.vol) - dt*0.8) : 0.75;
  AU.eng.set(ENG.rpm, ENG.load, ENG.vol, t);

  if (ENG.prevLoad > 0.6 && ENG.load < 0.3 && ENG.rpm > 4800) ENG.popT = 0.6;
  ENG.prevLoad = ENG.load;

  let near = null, nd = 1e9;
  for (const c of cars) { if (c.isPlayer) continue; const d = Math.hypot(c.wx - p.wx, c.wy - p.wy); if (d < nd) { nd = d; near = c; } }
  if (near && racing && nd < 520) {
    let pan = 0;
    if (viewM) { const sx = (viewM.a*near.wx + viewM.c*near.wy + viewM.e)/DPR; pan = (sx - W/2)/(W/2); }
    AU.rival.set(rivalRPM(near.v), near.throttle ? 1 : 0.3, 0.32*Math.max(0, 1 - nd/520), t, pan*0.8);
  } else AU.rival.set(1000, 0, 0, t, 0);

  const sk = racing && !p.onGrass && !(p.surf && p.surf.loose) ? Math.max(0, Math.min(1, ((p.skid || 0) - 0.15)/0.55)) : 0;
  const level = Math.max(sk*sk*(3 - 2*sk)*Math.min(1, (p.v || 0)/260), racing && p.stallT > 0 ? 0.75 : 0);
  AU.sqS.playbackRate.setTargetAtTime(0.88 + sk*0.25 + vr*0.12, t, 0.05);
  AU.sqG.gain.setTargetAtTime(level*0.32, t, 0.05);

  AU.rbG.gain.setTargetAtTime(racing && p.onGrass ? Math.min(0.5, vr*0.75) : racing && p.surf && p.surf.loose ? Math.min(0.4, vr*(p.surf === SURF.grava ? 0.6 : 0.4)) : 0, t, 0.06);
  if (AU.crG) AU.crG.gain.setTargetAtTime(racing && p.surf && p.surf.loose && !p.onGrass ? vr*(p.surf === SURF.grava ? 0.16 : 0.07) : 0, t, 0.05);
  AU.rbLp.frequency.setTargetAtTime(200 + vr*300, t, 0.1);
  let curb = 0;
  if (racing && !p.onGrass && Math.abs(p.d) > HALF_W - 4) { const k = Math.abs(sample(mod(p.dist), tA).k); if (k > 1/700) curb = 1; }
  const cl = curb*Math.min(0.35, vr*0.5);
  AU.cbL.frequency.setTargetAtTime(Math.max(4, (p.v || 0)/26), t, 0.03);
  AU.cbG.gain.setTargetAtTime(cl*0.5, t, 0.02); AU.cbLg.gain.setTargetAtTime(cl*0.5, t, 0.02);
  AU.wnG.gain.setTargetAtTime(racing ? vr*vr*0.04 : 0, t, 0.2);
  const rk = quiet ? 0 : WX.rainK;
  AU.rnG.gain.setTargetAtTime(0.09*rk, t, 0.3); AU.rdG.gain.setTargetAtTime(0.12*rk, t, 0.3);
}

function colDist(a, b) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  try { const A = p(a), B = p(b), rm = (A[0] + B[0])/2, dr = A[0] - B[0], dg = A[1] - B[1], db = A[2] - B[2];
        return Math.sqrt((2 + rm/256)*dr*dr + 4*dg*dg + (2 + (255 - rm)/256)*db*db); } catch(e) { return 999; }
}
function fixRivalColors() {
  const mine = prof.col, NEAR = 185, used = cars.filter(c => !c.isPlayer).map(c => c.col);
  for (const c of cars) {
    if (c.isPlayer || c.isP2 || colDist(c.col, mine) >= NEAR) continue;
    const pool = RIVAL_COLORS.concat(EXTRA_COLORS).filter(p => colDist(p[0], mine) >= NEAR && !used.some(u => colDist(u, p[0]) < 60));
    const pick = (pool.length ? pool : RIVAL_COLORS.concat(EXTRA_COLORS)).slice().sort((x, y) => colDist(y[0], mine) - colDist(x[0], mine))[pool.length ? (Math.random()*Math.min(3, pool.length))|0 : 0];
    used.push(pick[0]); c.col = pick[0]; c.acc = pick[1]; c.spr = null;

/* IA: acelera a fondo salvo que no llegue a frenar para la curva que viene */
function aiThrottle(c, sk) {
  const s = mod(c.dist), grip = C.agarreEnCurvas*c.gripMul*WX.grip*(GRIP_MOD || 1)*(sk || c.skillNow*(1 - 0.14*WX.wetK))*(1 - Math.max(0, c.v - 400)/900), v2 = c.v*c.v, dec = C.friccion*(1 + (c.brakeMul - 1)*0.35)*(1 - 0.15*WX.wetK);

/* Línea de carrera: busca el vértice de la curva; los rivales además adelantan/esquivan */
function laneLogic(c, dt) {

  const apex = Math.max(-38, Math.min(38, ka*6500));

    const o = c.isPlayer ? p2 : player, g = Math.abs(wrapDiff(o.dist - c.dist));

  }

  if (c.decT <= 0 && c.otT <= 0) {
    let best = null, bg = 1e9;
    for (const o of cars) {

      if (g > 0 && g < 105 && Math.abs(o.d - c.d) < 30 && g < bg) { bg = g; best = o; }
    }
    if (best && c.v > best.v - 5) {
      c.decT = 0.6;
      if (Math.random() > c.aggr) {         // adelanta por el lado libre
        let side = c.d >= best.d ? 1 : -1;
        if (Math.abs(best.d + side*36) > HALF_W - 14) side = -side;
        c.otLane = Math.max(-(HALF_W - 14), Math.min(HALF_W - 14, best.d + side*36));

    }
  }

  if (c.mistakeT <= 0) { c.mistakeT = rand(3, 7); c.skillNow = c.skill + (Math.random() < (c.mistakeP !== undefined ? c.mistakeP : 0.12) ? rand(0.2, 0.38) : rand(-0.04, 0.04)); }

function updateDraft() {

    for (const o of cars) {
      if (o === c) continue; const g = wrapDiff(o.dist - c.dist);
      if (g > 30 && g < 150 && Math.abs(o.d - c.d) < 22) { c.draft = true; break; }
    }

// Choque entre autos: cada auto son dos círculos; impulso elástico en el punto de contacto (genera giros)
function collide(a, b) {
  if (a.airT > 0 || b.airT > 0) return;   // uno pasa volando por arriba del otro
  if (BRIDGE && carLevel(a) !== carLevel(b)) return;   // uno va por el puente y el otro por abajo
  if (Math.abs(a.x - b.x) > 60 || Math.abs(a.y - b.y) > 60) return;
  const fa = [Math.cos(a.h), Math.sin(a.h)], fb = [Math.cos(b.h), Math.sin(b.h)];
  const rr_ = a.cr + b.cr;
  for (const ia of [a.co, -a.co]) for (const ib of [b.co, -b.co]) {
    const pax = a.x + fa[0]*ia, pay = a.y + fa[1]*ia, pbx = b.x + fb[0]*ib, pby = b.y + fb[1]*ib;
    let dx = pbx - pax, dy = pby - pay; const dist = Math.hypot(dx, dy);

    const rvx = vbx - vax, rvy = vby - vay, vn = rvx*nx + rvy*ny;
    if (vn < 0) {
      const ran = rax*ny - ray*nx, rbn = rbx*ny - rby*nx;
      const j = -(1 + C.fuerzaDeRebote)*vn/(2 + ran*ran/VEH.Icol + rbn*rbn/VEH.Icol);

      const jt = Math.max(-0.3*j, Math.min(0.3*j, -vt/(2 + rat*rat/VEH.Icol + rbt*rbt/VEH.Icol)));

    }
    project(a); project(b);
    return;
  }

let order = [];
function updateRanking() {
  order = cars.slice().sort((a, b) => (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : b.dist - a.dist);
  order.forEach((c, i) => { if (!(c.finished && c.pos)) c.pos = i + 1; });

const cam = { x: 0, y: 0, ang: 0, zoom: 1, ax: 0.5, ay: 0.68, ao: 0, zm: 1 };

  { ax: 0.50, ay: 0.62, ao: -0.22, z: 0.80 },

let camPreset = 0, camT = 5;

    if (!held) LAUNCH.pressCd = null;
    if (duoMode) { if (held2 && LAUNCH2.pressCd === null) LAUNCH2.pressCd = countdown; if (!held2) LAUNCH2.pressCd = null; }

      if (sayOK() && !tut) sayPick(['¡Largamos!', '¡Luz verde! ¡A fondo!', '¡Y largan!'], ['Go, go, go!', 'Green light! Floor it!', 'And they\'re off!']);

      const pc = held ? LAUNCH.pressCd : null, vm = C.velocidadMaxima;

  { const kd = Math.exp(-11*dt); kickX *= kd; kickY *= kd; }

let gPat = null;
function gPreviewLoop(now) {
  if (!garageOpen) return;
  const cvp = gEl.querySelector('#gPrev'), dpr = Math.min(3, devicePixelRatio || 1);
  const w = cvp.clientWidth, h = cvp.clientHeight;
  if (cvp.width !== Math.round(w*dpr)) { cvp.width = Math.round(w*dpr); cvp.height = Math.round(h*dpr); gPat = null; }
  const g = cvp.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!gPat) gPat = g.createPattern(texAsphalt, 'repeat');
  g.fillStyle = gPat; g.fillRect(0, 0, w, h);
  const sl = g.createRadialGradient(w/2, h*0.5, 10, w/2, h*0.5, Math.max(w, h)*0.7);
  sl.addColorStop(0, 'rgba(255,240,220,.18)'); sl.addColorStop(1, 'rgba(0,0,0,.6)'); g.fillStyle = sl; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(240,240,235,.5)'; g.lineWidth = 3; g.setLineDash([22, 18]); g.lineDashOffset = -(now*0.04 % 40);
  g.beginPath(); g.moveTo(0, 16); g.lineTo(w, 16); g.stroke(); g.setLineDash([]);
  const key = [gView, prof.col, prof.acc, prof.num, prof.stripe, prof.style.rim].join('|');
  if (key !== gSprKey) { gSpr = makeCarSprite(specFor(gView)); gSprKey = key; }
  const k = Math.min(h/40, w/68), ang = Math.sin(now*0.0007)*0.35 - 0.12;
  if (gTab === 'estilo') {   // humo del derrape detrás del auto
    g.save(); g.translate(w/2, h/2); g.rotate(ang);
    for (let i = 0; i < 9; i++) { const t = ((now*0.0006 + i/9) % 1), col = prof.style.smoke === 'blanco' ? '#ece8de' : prof.style.smoke === 'arcoiris' ? RAINBOW[i % RAINBOW.length] : prof.style.smoke === 'fuego' ? FIRE[i % FIRE.length] : prof.style.smoke;
      const sz = (8 + t*26)*k/2; g.globalAlpha = 0.55*(1 - t); for (const sd of [-1, 1]) g.drawImage(tintPuff(col), (-24 - t*60)*k/1.4 - sz, sd*(9 + t*8)*k/1.4 - sz, sz*2, sz*2); }
    g.restore(); g.globalAlpha = 1;
  }
  if (prof.style.neon !== 'no') { g.save(); g.translate(w/2, h/2); g.rotate(ang); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.9; g.drawImage(tintPuff(prof.style.neon), -42*k, -27*k, 84*k, 54*k); g.restore(); }
  g.save(); g.translate(w/2 + 6, h/2 + 8); g.rotate(ang); g.globalAlpha = 0.85; g.drawImage(carShadowFor(gView), -30*k, -18*k, 60*k, 36*k); g.restore();
  g.save(); g.translate(w/2, h/2); g.rotate(ang); g.drawImage(gSpr, -30*k, -18*k, 60*k, 36*k); g.restore();
  requestAnimationFrame(gPreviewLoop);
}

function troTier(t) { const v = t.v(); let k = 0; for (const g of t.goals) if (v >= g) k++; return k; }
function troCount() { let n = 0, pl = 0; for (const t of TROPHIES) { const k = prof.tro[t.id] || 0; n += k; if (k >= 4) pl++; } return { n, pl, max: TROPHIES.length*4 }; }
// revisa los trofeos, paga los niveles nuevos y devuelve la lista para mostrar
function troCheck() {
  const got = [];
  for (const t of TROPHIES) {
    let k = 0; try { k = troTier(t); } catch(e) { continue; }
    const had = prof.tro[t.id] || 0;
    for (let i = had + 1; i <= k; i++) { prof.money += TRO_PAY[i]; got.push({ kind: 'TROFEO DE ' + TRO_TIER[i], head: '🏆 TROFEO DE ' + TRO_TIER[i], ico: '🏆', txt: t.name, pay: TRO_PAY[i], tier: i }); }
    if (k > had) prof.tro[t.id] = k;
  }
  if (got.length) saveProf();
  return got;
}
// si salen muchos trofeos juntos (por ejemplo, la primera vez), se muestran en un solo aviso
function troSum(list) {
  if (list.length <= 2) return list;
  return [{ kind: list.length + ' TROFEOS', head: '🏆 ' + list.length + ' TROFEOS NUEVOS', ico: '🏆', txt: 'Miralos en la Vitrina', pay: list.reduce((a, g) => a + g.pay, 0) }];
}
function tcAdd(k, n) { prof.tc[k] = (prof.tc[k] || 0) + (n === undefined ? 1 : n); }
// lo que se cuenta al terminar una carrera común, de copa o del evento
function tcAfterRace(s) {
  tcAdd('races'); if (s.pos === 1) tcAdd('wins'); if (s.pos <= 3) tcAdd('podium');
  if ((s.dmg || 0) < 0.01 && SET.damage !== false && s.crashes === 0) tcAdd('intact');   // con los daños activados
  if (s.crashes === 0 && s.grass === 0) tcAdd('clean');
  if (s.pos === 1 && s.n > 1 && s.startPos === s.n) tcAdd('comeb');
  if (s.pos === 1 && order[1]) { const sec = order[1], gap = (player.dist - sec.dist)/Math.max(60, sec.v || 0); if (gap < 0.3) tcAdd('photo'); }
  tcAdd('drifts', s.drifts || 0); tcAdd('pass', s.overtakes || 0); tcAdd('crash', s.crashes || 0); tcAdd('spin', s.spins || 0);
  if (s.pos === 1 && (s.wx === 'noche' || s.wx === 'tormenta' || s.wx === 'cambian')) tcAdd('night');
  if (s.pos === 1 && (s.wx === 'lluvia' || s.wx === 'tormenta' || s.wx === 'cambia' || s.wx === 'cambian')) tcAdd('rain');
  tcAddKm(); prof.tc.vmax = Math.max(tcv('vmax'), s.maxKmh || 0);
}
function tcAddKm() { tcAdd('km', Math.max(0, player.dist || 0)*(280/C.velocidadMaxima)/3600); }

  if (player.finished && raceTime > player.finishTime + 1.6) return;   // después de la meta ya no hace falta
  const b = RP.buf, t = raceTime;
  if (b.length && t - b[b.length - 1].t < 1/30) return;

  const f = new Float32Array(cars.length*4);

  let t1 = Math.min(last, fin + 1.4), t0 = Math.max(b[0].t, t1 - 8.5);
