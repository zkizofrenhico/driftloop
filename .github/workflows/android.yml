# Arma la app de Android en los servidores de GitHub y la publica para descargarla desde el celular:
# https://github.com/zkizofrenhico/driftloop/releases/download/app/DriftLoop.apk
# Las ramas prueba/** arman un instalador aparte, sin tocar el de arriba:
# https://github.com/zkizofrenhico/driftloop/releases/download/app-prueba/DriftLoop-prueba.apk
name: App Android

on:
  push:
    branches: [main, 'prueba/**']
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_PASS: ${{ secrets.DRIFTLOOP_UPLOAD_PASS }}
      UPLOAD_KEYSTORE: ${{ secrets.DRIFTLOOP_UPLOAD_KEYSTORE }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Copiar la última versión del juego a la app
        run: python3 app/tools/build_www.py

      - name: Instalar Capacitor y plugins
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Sincronizar el proyecto Android
        working-directory: app
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../DriftLoop.apk

      # Versión para subir a Google Play (.aab firmado). Solo corre si están cargados los secretos
      # DRIFTLOOP_UPLOAD_KEYSTORE (la llave en base64) y DRIFTLOOP_UPLOAD_PASS. La llave nunca va al repositorio.
      - name: Armar la versión para Google Play
        if: env.UPLOAD_PASS != '' && env.UPLOAD_KEYSTORE != ''
        working-directory: app/android
        run: |
          printf '%s' "$UPLOAD_KEYSTORE" | base64 -d > upload.keystore
          DRIFTLOOP_UPLOAD_PASS="$UPLOAD_PASS" ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../../DriftLoop.aab
          rm -f upload.keystore

      - name: Publicar el APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            gh release delete app --yes --cleanup-tag || true
            gh release create app DriftLoop.apk $( [ -f DriftLoop.aab ] && echo DriftLoop.aab ) --prerelease --target "$GITHUB_SHA" --title "Drift Loop — app de Android" \
              --notes "Instalador de prueba armado automáticamente con la última versión del juego ($(date -u +'%d/%m/%Y %H:%M') UTC). Abrilo desde el celular y aceptá instalar apps desconocidas."
          else
            cp DriftLoop.apk DriftLoop-prueba.apk
            [ -f DriftLoop.aab ] && cp DriftLoop.aab DriftLoop-prueba.aab
            gh release delete app-prueba --yes --cleanup-tag || true
            gh release create app-prueba DriftLoop-prueba.apk $( [ -f DriftLoop-prueba.aab ] && echo DriftLoop-prueba.aab ) --prerelease --target "$GITHUB_SHA" --title "Drift Loop — PRUEBA ($GITHUB_REF_NAME)" \
              --notes "Instalador de la rama $GITHUB_REF_NAME ($(date -u +'%d/%m/%Y %H:%M') UTC). Se instala encima de la app actual y conserva la partida. Trae anuncios de PRUEBA de Google."
          fi
